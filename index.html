<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Sheenaz — 4th Grade Math Book</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1f232c;
    --fg: #e8e8ea;
    --muted: #a0a4ad;
    --accent: #7aa8ff;
    --accent-2: #ffcc66;
    --border: #262a33;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f7f8fb;
      --panel: #ffffff;
      --panel-2: #f0f2f6;
      --fg: #1b1d22;
      --muted: #5d6472;
      --accent: #2a63d8;
      --accent-2: #a06b00;
      --border: #e3e6ec;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 14px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    color: var(--fg); background: var(--bg);
    display: grid; grid-template-columns: 300px 1fr; grid-template-rows: 48px 1fr;
    grid-template-areas: "topbar topbar" "side main";
  }
  .topbar {
    grid-area: topbar;
    display: flex; align-items: center; gap: 8px;
    padding: 0 12px; background: var(--panel); border-bottom: 1px solid var(--border);
  }
  .topbar h1 { font-size: 15px; margin: 0 12px 0 0; font-weight: 600; }
  .side {
    grid-area: side; background: var(--panel); border-right: 1px solid var(--border);
    overflow-y: auto;
  }
  .main {
    grid-area: main; display: flex; flex-direction: column;
    align-items: center; overflow: auto; padding: 16px; gap: 12px;
  }
  button, select, input[type=number], input[type=search] {
    background: var(--panel-2); color: var(--fg);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 10px; font: inherit;
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  .spacer { flex: 1; }
  .page-wrap {
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px; max-width: 1200px; width: 100%;
    display: flex; justify-content: center;
  }
  .page-wrap img {
    max-width: 100%; max-height: calc(100vh - 160px); object-fit: contain; border-radius: 4px;
  }
  .nav-row {
    display: flex; align-items: center; gap: 12px; width: 100%; max-width: 1200px;
    justify-content: space-between;
  }
  .nav-left, .nav-right { display: flex; align-items: center; gap: 8px; }
  .page-label { color: var(--muted); font-variant-numeric: tabular-nums; }
  .toc {
    padding: 10px 12px;
  }
  .toc h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em;
            color: var(--muted); margin: 10px 4px 6px; }
  .toc ul { list-style: none; margin: 0; padding: 0; }
  .toc .chap {
    padding: 6px 8px; border-radius: 6px; cursor: pointer;
    display: flex; justify-content: space-between; gap: 8px;
  }
  .toc .chap:hover { background: var(--panel-2); }
  .toc .chap.active { background: var(--panel-2); color: var(--accent); }
  .toc .sub {
    padding: 4px 8px 4px 24px; border-radius: 6px; cursor: pointer;
    color: var(--muted); display: flex; justify-content: space-between; gap: 8px;
    font-size: 13px;
  }
  .toc .sub:hover { background: var(--panel-2); color: var(--fg); }
  .toc .sub.active { background: var(--panel-2); color: var(--accent); }
  .toc .pageno { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
  .search-results {
    position: absolute; top: 44px; right: 12px; width: 420px; max-height: 60vh;
    overflow: auto; background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.25); padding: 6px;
    display: none; z-index: 10;
  }
  .search-results.open { display: block; }
  .hit { padding: 8px 10px; border-radius: 6px; cursor: pointer; }
  .hit:hover { background: var(--panel-2); }
  .hit .where { color: var(--accent); font-size: 12px; margin-bottom: 2px; }
  .hit .snippet { color: var(--fg); font-size: 12px; }
  .hit mark { background: var(--accent-2); color: #000; padding: 0 2px; border-radius: 2px; }
  .empty { color: var(--muted); padding: 20px; text-align: center; }
  .status { color: var(--muted); font-size: 12px; }
  @media (max-width: 760px) {
    body { grid-template-columns: 1fr; grid-template-areas: "topbar" "main"; }
    .side { display: none; }
  }
</style>
</head>
<body>
  <div class="topbar">
    <h1>Sheenaz — 4th Grade Math</h1>
    <select id="chapterSelect" title="Jump to chapter"></select>
    <input id="pageJump" type="number" min="1" placeholder="page #" style="width: 90px" />
    <button id="goPage">Go</button>
    <div style="position: relative; flex: 1; max-width: 420px;">
      <input id="search" type="search" placeholder="Search the book…" style="width: 100%" />
      <div id="searchResults" class="search-results"></div>
    </div>
    <span class="spacer"></span>
    <span class="status" id="status"></span>
  </div>
  <aside class="side">
    <nav class="toc" id="toc"><div class="empty">Loading index…</div></nav>
  </aside>
  <main class="main">
    <div class="nav-row">
      <div class="nav-left">
        <button id="prev" title="Previous page (←)">◀ Prev</button>
        <button id="next" title="Next page (→)">Next ▶</button>
      </div>
      <div class="page-label" id="pageLabel">—</div>
      <div class="nav-right">
        <button id="zoomOut" title="Zoom out">−</button>
        <button id="zoomReset" title="Reset zoom">100%</button>
        <button id="zoomIn" title="Zoom in">+</button>
        <button id="rotateLeft" title="Rotate this page 90° left (r)">↺</button>
        <button id="rotateRight" title="Rotate this page 90° right (shift+r)">↻</button>
      </div>
    </div>
    <div class="page-wrap">
      <img id="pageImg" alt="page" />
    </div>
  </main>

<script>
(async function () {
  const $ = (id) => document.getElementById(id);
  const status = $("status");

  function setStatus(s) { status.textContent = s; }

  // Load data
  let manifest, ocr, chapters;
  try {
    const [m, o, c] = await Promise.all([
      fetch("pages/manifest.json").then(r => r.json()),
      fetch("pages/ocr.json").then(r => r.json()).catch(() => []),
      fetch("chapters.json").then(r => r.json()).catch(() => ({ chapters: [] })),
    ]);
    manifest = m; ocr = o; chapters = c;
  } catch (e) {
    setStatus("Failed to load book data. Run the build scripts first.");
    return;
  }

  const totalPages = manifest.length;
  const ocrByPage = new Map(ocr.map(e => [e.page, e.text || ""]));

  // State
  const state = {
    page: Number(new URLSearchParams(location.search).get("p")) || 1,
    zoom: 1,
  };
  if (state.page < 1 || state.page > totalPages) state.page = 1;
  const ROT_KEY = "mathbook-rotations-v1";
  const rotations = (() => {
    try { return JSON.parse(localStorage.getItem(ROT_KEY) || "{}"); }
    catch { return {}; }
  })();
  function getRot(p) { return ((rotations[p] || 0) % 360 + 360) % 360; }
  function setRot(p, deg) {
    deg = ((deg % 360) + 360) % 360;
    if (deg === 0) delete rotations[p]; else rotations[p] = deg;
    try { localStorage.setItem(ROT_KEY, JSON.stringify(rotations)); } catch {}
  }

  // Render chapter dropdown + sidebar TOC
  const chapSelect = $("chapterSelect");
  const toc = $("toc");
  chapSelect.innerHTML = "";
  const noneOpt = document.createElement("option");
  noneOpt.value = ""; noneOpt.textContent = "— Jump to chapter —";
  chapSelect.appendChild(noneOpt);

  if (chapters.chapters && chapters.chapters.length) {
    toc.innerHTML = "";
    const h = document.createElement("h2");
    h.textContent = "Contents";
    toc.appendChild(h);
    const ul = document.createElement("ul");
    toc.appendChild(ul);
    for (const ch of chapters.chapters) {
      const li = document.createElement("li");
      li.className = "chap";
      li.dataset.page = ch.page;
      li.innerHTML = `<span>${escapeHtml(ch.title)}</span><span class="pageno">${ch.page}</span>`;
      li.addEventListener("click", () => goTo(ch.page));
      ul.appendChild(li);
      const opt = document.createElement("option");
      opt.value = ch.page; opt.textContent = ch.title;
      chapSelect.appendChild(opt);
      if (ch.subsections) {
        for (const sub of ch.subsections) {
          const sli = document.createElement("li");
          sli.className = "sub";
          sli.dataset.page = sub.page;
          sli.innerHTML = `<span>${escapeHtml(sub.title)}</span><span class="pageno">${sub.page}</span>`;
          sli.addEventListener("click", () => goTo(sub.page));
          ul.appendChild(sli);
        }
      }
    }
  } else {
    toc.innerHTML = `<div class="empty">No chapter index yet.<br/>Add <code>chapters.json</code>.</div>`;
  }

  // Navigation
  function goTo(p) {
    p = Math.max(1, Math.min(totalPages, Number(p) || 1));
    state.page = p;
    render();
    const url = new URL(location.href);
    url.searchParams.set("p", p);
    history.replaceState(null, "", url);
  }
  function render() {
    const entry = manifest[state.page - 1];
    const img = $("pageImg");
    img.src = `pages/${entry.file}`;
    const rot = getRot(state.page);
    img.style.transform = `rotate(${rot}deg) scale(${state.zoom})`;
    img.style.transformOrigin = "center center";
    $("pageLabel").textContent = `Page ${state.page} of ${totalPages}`;
    $("prev").disabled = state.page === 1;
    $("next").disabled = state.page === totalPages;
    // Highlight TOC
    document.querySelectorAll(".toc .chap, .toc .sub").forEach(el => el.classList.remove("active"));
    const items = Array.from(document.querySelectorAll(".toc [data-page]"))
      .map(el => ({ el, p: Number(el.dataset.page) }))
      .filter(x => x.p <= state.page)
      .sort((a, b) => b.p - a.p);
    if (items.length) items[0].el.classList.add("active");
  }

  $("prev").addEventListener("click", () => goTo(state.page - 1));
  $("next").addEventListener("click", () => goTo(state.page + 1));
  $("goPage").addEventListener("click", () => goTo($("pageJump").value));
  $("pageJump").addEventListener("keydown", e => { if (e.key === "Enter") goTo(e.target.value); });
  chapSelect.addEventListener("change", e => { if (e.target.value) { goTo(e.target.value); e.target.value = ""; } });

  $("zoomIn").addEventListener("click", () => { state.zoom = Math.min(3, state.zoom + 0.1); render(); });
  $("zoomOut").addEventListener("click", () => { state.zoom = Math.max(0.5, state.zoom - 0.1); render(); });
  $("zoomReset").addEventListener("click", () => { state.zoom = 1; render(); });
  $("rotateLeft").addEventListener("click", () => { setRot(state.page, getRot(state.page) - 90); render(); });
  $("rotateRight").addEventListener("click", () => { setRot(state.page, getRot(state.page) + 90); render(); });

  document.addEventListener("keydown", e => {
    if (e.target.matches("input, select, textarea")) return;
    if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") { goTo(state.page + 1); e.preventDefault(); }
    else if (e.key === "ArrowLeft" || e.key === "PageUp") { goTo(state.page - 1); e.preventDefault(); }
    else if (e.key === "Home") { goTo(1); }
    else if (e.key === "End") { goTo(totalPages); }
    else if (e.key === "/") { $("search").focus(); e.preventDefault(); }
    else if (e.key === "r" && !e.shiftKey) { setRot(state.page, getRot(state.page) - 90); render(); }
    else if (e.key === "R" || (e.key === "r" && e.shiftKey)) { setRot(state.page, getRot(state.page) + 90); render(); }
  });

  // Search
  const results = $("searchResults");
  const searchBox = $("search");
  function esc(s) { return s.replace(/[-/\\^$*+?.()|[\]{}]/g, "\\$&"); }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  function snippet(text, re) {
    const m = re.exec(text);
    if (!m) return "";
    const i = Math.max(0, m.index - 40);
    const j = Math.min(text.length, m.index + m[0].length + 60);
    const raw = (i > 0 ? "…" : "") + text.slice(i, j) + (j < text.length ? "…" : "");
    return escapeHtml(raw).replace(new RegExp(esc(m[0]), "gi"), (x) => `<mark>${x}</mark>`);
  }
  function runSearch() {
    const q = searchBox.value.trim();
    results.innerHTML = "";
    if (!q) { results.classList.remove("open"); return; }
    // Numeric → jump
    if (/^\d+$/.test(q)) {
      const p = Number(q);
      const d = document.createElement("div");
      d.className = "hit";
      d.innerHTML = `<div class="where">Go to page ${p}</div>`;
      d.addEventListener("click", () => { goTo(p); hide(); });
      results.appendChild(d);
    }
    const re = new RegExp(esc(q), "i");
    const hits = [];
    for (const entry of ocr) {
      if (re.test(entry.text || "")) hits.push(entry);
      if (hits.length >= 50) break;
    }
    if (!hits.length && !/^\d+$/.test(q)) {
      results.innerHTML = `<div class="empty">No matches</div>`;
    } else {
      for (const h of hits) {
        const d = document.createElement("div");
        d.className = "hit";
        d.innerHTML = `<div class="where">Page ${h.page}</div><div class="snippet">${snippet(h.text, re)}</div>`;
        d.addEventListener("click", () => { goTo(h.page); hide(); });
        results.appendChild(d);
      }
    }
    results.classList.add("open");
  }
  function hide() { results.classList.remove("open"); searchBox.value = ""; }
  let t;
  searchBox.addEventListener("input", () => { clearTimeout(t); t = setTimeout(runSearch, 120); });
  searchBox.addEventListener("keydown", e => { if (e.key === "Escape") hide(); });
  document.addEventListener("click", (e) => {
    if (!results.contains(e.target) && e.target !== searchBox) results.classList.remove("open");
  });

  setStatus(ocr.length ? `${ocr.length} pages indexed` : "no OCR yet");
  render();
})();
</script>
</body>
</html>
